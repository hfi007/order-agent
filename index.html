 <!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Order Agent</title>
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=Syne:wght@400;600;700;800&display=swap');

  :root {
    --bg: #0a0a0a;
    --surface: #111111;
    --border: #222222;
    --accent: #e8ff47;
    --accent2: #ff6b35;
    --text: #f0f0f0;
    --muted: #666;
    --user-bubble: #1a1a1a;
    --agent-bubble: #141f00;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Mono', monospace;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }

  .container {
    width: 100%;
    max-width: 680px;
    height: 100vh;
    display: flex;
    flex-direction: column;
    padding: 0;
  }

  .header {
    padding: 20px 24px 16px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 14px;
    background: var(--surface);
    position: relative;
    overflow: hidden;
  }

  .header::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
    background: linear-gradient(90deg, var(--accent), var(--accent2), var(--accent));
    background-size: 200% 100%;
    animation: shimmer 3s linear infinite;
  }

  @keyframes shimmer {
    0% { background-position: 200% 0; }
    100% { background-position: -200% 0; }
  }

  .logo {
    width: 36px;
    height: 36px;
    background: var(--accent);
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Syne', sans-serif;
    font-weight: 800;
    font-size: 16px;
    color: #0a0a0a;
    flex-shrink: 0;
  }

  .header-text h1 {
    font-family: 'Syne', sans-serif;
    font-weight: 700;
    font-size: 15px;
    letter-spacing: 0.02em;
    color: var(--text);
  }

 .header-text p {
    font-size: 11px;
    color: var(--muted);
    margin-top: 2px;
  }

  .status-dot {
    width: 7px;
    height: 7px;
    background: var(--accent);
    border-radius: 50%;
    margin-left: auto;
    animation: pulse 2s ease-in-out infinite;
    flex-shrink: 0;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.4; transform: scale(0.8); }
  }

  .messages {
    flex: 1;
    overflow-y: auto;
    padding: 24px 20px;
    display: flex;
    flex-direction: column;
    gap: 16px;
    scroll-behavior: smooth;
  }

  .messages::-webkit-scrollbar { width: 3px; }
  .messages::-webkit-scrollbar-track { background: transparent; }
  .messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  .message {
    display: flex;
    flex-direction: column;
    gap: 4px;
    animation: fadeUp 0.3s ease forwards;
    opacity: 0;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .message.user { align-items: flex-end; }
  .message.agent { align-items: flex-start; }

  .bubble {
    max-width: 82%;
    padding: 12px 16px;
    border-radius: 16px;
    font-size: 13px;
    line-height: 1.6;
  }

  .message.user .bubble {
    background: var(--user-bubble);
    border: 1px solid var(--border);
    border-bottom-right-radius: 4px;
    color: var(--text);
  }

  .message.agent .bubble {
    background: var(--agent-bubble);
    border: 1px solid #2a3800;
    border-bottom-left-radius: 4px;
    color: var(--text);
  }

  .message-label {
    font-size: 10px;
    color: var(--muted);
    letter-spacing: 0.08em;
    text-transform: uppercase;
    padding: 0 4px;
  }

  .typing-indicator {
    display: flex;
    gap: 5px;
    padding: 14px 18px;
    background: var(--agent-bubble);
    border: 1px solid #2a3800;
    border-radius: 16px;
    border-bottom-left-radius: 4px;
    width: fit-content;
  }

  .typing-indicator span {
    width: 6px;
    height: 6px;
    background: var(--accent);
    border-radius: 50%;
    animation: bounce 1.2s ease-in-out infinite;
    opacity: 0.4;
  }

  .typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
  .typing-indicator span:nth-child(3) { animation-delay: 0.4s; }

  @keyframes bounce {
    0%, 100% { transform: translateY(0); opacity: 0.4; }
    50% { transform: translateY(-5px); opacity: 1; }
  }

  .order-card {
    background: #0d1500;
    border: 1px solid var(--accent);
    border-radius: 12px;
    padding: 16px;
    margin-top: 8px;
    font-size: 12px;
  }

  .order-card-title {
    font-family: 'Syne', sans-serif;
    font-weight: 700;
    color: var(--accent);
    font-size: 11px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    margin-bottom: 10px;
  }

  .order-row {
    display: flex;
    justify-content: space-between;
    padding: 5px 0;
    border-bottom: 1px solid #1a2200;
    color: #ccc;
  }

  .order-row:last-child { border-bottom: none; }
  .order-row span:first-child { color: var(--muted); }
  .order-row span:last-child { font-weight: 500; color: var(--text); }

  .input-area {
    padding: 16px 20px;
    border-top: 1px solid var(--border);
    background: var(--surface);
    display: flex;
    gap: 10px;
    align-items: flex-end;
  }

  textarea {
    flex: 1;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 12px 16px;
    color: var(--text);
    font-family: 'DM Mono', monospace;
    font-size: 13px;
    resize: none;
    min-height: 44px;
    max-height: 120px;
    line-height: 1.5;
    outline: none;
    transition: border-color 0.2s;
  }

  textarea:focus { border-color: var(--accent); }
  textarea::placeholder { color: var(--muted); }

  button.send-btn {
    width: 44px;
    height: 44px;
    background: var(--accent);
    border: none;
    border-radius: 12px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: all 0.15s;
  }

  button.send-btn:hover { background: #d4eb30; transform: scale(1.05); }
  button.send-btn:active { transform: scale(0.97); }
  button.send-btn:disabled { background: var(--border); cursor: not-allowed; transform: none; }

  button.send-btn svg { width: 18px; height: 18px; color: #0a0a0a; }

  .email-status {
    font-size: 11px;
    color: var(--accent);
    padding: 6px 12px;
    background: #0d1500;
    border: 1px solid #2a3800;
    border-radius: 20px;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    margin-top: 8px;
  }

  .suppliers-row {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin-top: 10px;
  }

  .supplier-tag {
    font-size: 10px;
    padding: 4px 10px;
    border-radius: 20px;
    border: 1px solid var(--border);
    color: var(--muted);
    letter-spacing: 0.05em;
    text-transform: uppercase;
  }

  .supplier-tag.active {
    border-color: var(--accent);
    color: var(--accent);
    background: #0d1500;
  }

  @media (max-width: 680px) {
    .container { max-width: 100%; }
  }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <div class="logo">OA</div>
    <div class="header-text">
      <h1>Order Agent</h1>
      <p>Procurement Assistant — CEF · TLC · Screwfix</p>
    </div>
    <div class="status-dot"></div>
  </div>

  <div class="messages" id="messages"></div>

  <div class="input-area">
    <textarea id="input" placeholder="Describe what you need to order..." rows="1" onkeydown="handleKey(event)" oninput="autoResize(this)"></textarea>
    <button class="send-btn" id="sendBtn" onclick="sendMessage()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <line x1="22" y1="2" x2="11" y2="13"></line>
        <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
      </svg>
    </button>
  </div>
</div>

<script>
const EMAILJS_SERVICE_ID = "service_npm4b1b";
const EMAILJS_TEMPLATE_ID = "template_bww551g";
const EMAILJS_PUBLIC_KEY = "Dl6NReGq2ElFET45U";
let ANTHROPIC_API_KEY = "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";
const APPROVAL_EMAIL = "hamzah.faruq007@gmail.com";

emailjs.init(EMAILJS_PUBLIC_KEY);

const SYSTEM_PROMPT = `You are a procurement assistant for an electrical contracting business. Your job is to help colleagues place orders with suppliers.

Your suppliers are:
- CEF (City Electrical Factors) - electrical wholesale
- TLC Electrical - electrical wholesale  
- Screwfix - tools, fixings, general trade supplies

Your job:
1. Greet the colleague and ask what they need to order
2. Collect: product name/description, quantity, preferred supplier (or suggest one), urgency
3. Ask clarifying questions if needed (cable size, rating, brand preference, etc.)
4. Once you have all details, summarise the order and confirm with the colleague
5. When confirmed, respond with a JSON block in this exact format (nothing else after it):

ORDER_CONFIRMED:
{
  "colleague_name": "name if given or Unknown",
  "items": [{"product": "...", "quantity": "...", "supplier": "CEF/TLC/Screwfix", "notes": "..."}],
  "urgency": "standard/urgent/next-day",
  "total_items": number
}

Be concise, professional, and trade-knowledgeable. You understand electrical materials — cable types, CU vs RCBO, conduit, trunking, accessories, tools etc.`;

let conversationHistory = [];
let orderSubmitted = false;

function addMessage(role, content, extra) {
  const msgs = document.getElementById('messages');
  const div = document.createElement('div');
  div.className = `message ${role}`;

  const label = document.createElement('div');
  label.className = 'message-label';
  label.textContent = role === 'user' ? 'You' : 'Agent';

  const bubble = document.createElement('div');
  bubble.className = 'bubble';

  // Check for order card
  if (content.includes('ORDER_CONFIRMED:')) {
    const parts = content.split('ORDER_CONFIRMED:');
    const textPart = parts[0].trim();
    if (textPart) bubble.textContent = textPart;

    try {
      const orderData = JSON.parse(parts[1].trim());
      const card = buildOrderCard(orderData);
      bubble.appendChild(card);

      // Trigger email send
      setTimeout(() => sendApprovalEmail(orderData), 800);
    } catch(e) {
      bubble.textContent = content;
    }
  } else {
    bubble.textContent = content;
  }

  if (extra) bubble.appendChild(extra);

  div.appendChild(label);
  div.appendChild(bubble);
  msgs.appendChild(div);
  msgs.scrollTop = msgs.scrollHeight;
}

function buildOrderCard(data) {
  const card = document.createElement('div');
  card.className = 'order-card';

  const title = document.createElement('div');
  title.className = 'order-card-title';
  title.textContent = '📋 Order Summary';
  card.appendChild(title);

  data.items.forEach((item, i) => {
    const row = document.createElement('div');
    row.className = 'order-row';
    row.innerHTML = `<span>Item ${i+1}</span><span>${item.quantity}x ${item.product}</span>`;
    card.appendChild(row);

    if (item.notes) {
      const noteRow = document.createElement('div');
      noteRow.className = 'order-row';
      noteRow.innerHTML = `<span>Notes</span><span>${item.notes}</span>`;
      card.appendChild(noteRow);
    }

    const supRow = document.createElement('div');
    supRow.className = 'order-row';
    supRow.innerHTML = `<span>Supplier</span><span>${item.supplier}</span>`;
    card.appendChild(supRow);
  });

  const urgRow = document.createElement('div');
  urgRow.className = 'order-row';
  urgRow.innerHTML = `<span>Urgency</span><span>${data.urgency}</span>`;
  card.appendChild(urgRow);

  return card;
}

function showTyping() {
  const msgs = document.getElementById('messages');
  const div = document.createElement('div');
  div.className = 'message agent';
  div.id = 'typing';

  const label = document.createElement('div');
  label.className = 'message-label';
  label.textContent = 'Agent';

  const indicator = document.createElement('div');
  indicator.className = 'typing-indicator';
  indicator.innerHTML = '<span></span><span></span><span></span>';

  div.appendChild(label);
  div.appendChild(indicator);
  msgs.appendChild(div);
  msgs.scrollTop = msgs.scrollHeight;
}

function removeTyping() {
  const t = document.getElementById('typing');
  if (t) t.remove();
}

async function sendMessage() {
  const input = document.getElementById('input');
  const text = input.value.trim();
  if (!text || orderSubmitted) return;

  input.value = '';
  autoResize(input);
  document.getElementById('sendBtn').disabled = true;

  addMessage('user', text);
  conversationHistory.push({ role: 'user', content: text });

  showTyping();

  try {
    const response = await fetch('https://order-proxy.hamzah-faruq007.workers.dev', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'x-api-key': ANTHROPIC_API_KEY,
        'anthropic-version': '2023-06-01',
        },
      body: JSON.stringify({
        model: 'claude-opus-4-7',
        max_tokens: 1000,
        system: SYSTEM_PROMPT,
        messages: conversationHistory
      })
    });

    const data = await response.json();
    const reply = data.content[0].text;

    removeTyping();
    conversationHistory.push({ role: 'assistant', content: reply });
    addMessage('agent', reply);

    if (reply.includes('ORDER_CONFIRMED:')) {
      orderSubmitted = true;
      document.getElementById('input').placeholder = 'Order submitted — awaiting approval';
    }
  } catch (err) {
    removeTyping();
    addMessage('agent', 'Error: ' + (err.message || JSON.stringify(err)));
  }

  document.getElementById('sendBtn').disabled = false;
}

async function sendApprovalEmail(orderData) {
  const orderId = 'order_' + Date.now();
  orderData._id = orderId;

  const itemsList = orderData.items.map((item, i) =>
    `Item ${i+1}: ${item.quantity}x ${item.product} — ${item.supplier}${item.notes ? ' (' + item.notes + ')' : ''}`
  ).join('\n');

  const approveUrl = `https://order-proxy.hamzah-faruq007.workers.dev/approve?id=${orderId}`;
  const rejectUrl = `https://order-proxy.hamzah-faruq007.workers.dev/reject?id=${orderId}`;

  const message = `New order requires your approval.\n\nColleague: ${orderData.colleague_name}\nUrgency: ${orderData.urgency}\n\nItems:\n${itemsList}\n\n✅ APPROVE: ${approveUrl}\n\n❌ REJECT: ${rejectUrl}\n\n— Order Agent`;

  const msgs = document.getElementById('messages');
  const div = document.createElement('div');
  div.className = 'message agent';

  const label = document.createElement('div');
  label.className = 'message-label';
  label.textContent = 'Agent';

  const bubble = document.createElement('div');
  bubble.className = 'bubble';

  try {
    // Save order data to worker for auto-ordering
    await fetch('https://order-proxy.hamzah-faruq007.workers.dev/save-order', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ ...orderData, orderId })
    });

    await emailjs.send(EMAILJS_SERVICE_ID, EMAILJS_TEMPLATE_ID, {
      to_email: APPROVAL_EMAIL,
      message: message
    });

    bubble.textContent = `Order logged and approval request sent to ${APPROVAL_EMAIL}. Waiting for your authorisation before placing with the supplier.`;

    const status = document.createElement('div');
    status.className = 'email-status';
    status.innerHTML = `<svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"></polyline></svg> Approval email sent`;
    bubble.appendChild(status);

    // Start polling for approval
    pollForApproval(orderData._id);

  } catch (err) {
    bubble.textContent = `Order logged, but there was an issue sending the approval email. Please notify the manager manually.`;

    const status = document.createElement('div');
    status.className = 'email-status';
    status.style.borderColor = '#ff6b35';
    status.style.color = '#ff6b35';
    status.innerHTML = `<svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg> Email failed — check EmailJS setup`;
    bubble.appendChild(status);
    console.error('EmailJS error:', err);
  }

  div.appendChild(label);
  div.appendChild(bubble);
  msgs.appendChild(div);
  msgs.scrollTop = msgs.scrollHeight;
}

async function pollForApproval(orderId) {
  const msgs = document.getElementById('messages');
  let attempts = 0;
  const maxAttempts = 120; // 10 minutes

  const interval = setInterval(async () => {
    attempts++;
    if (attempts > maxAttempts) {
      clearInterval(interval);
      return;
    }

    try {
      const res = await fetch(`https://order-proxy.hamzah-faruq007.workers.dev/status?id=${orderId}`);
      const data = await res.json();

      if (data.status === 'approved' || data.status === 'rejected') {
        clearInterval(interval);

        const div = document.createElement('div');
        div.className = 'message agent';
        const label = document.createElement('div');
        label.className = 'message-label';
        label.textContent = 'Agent';
        const bubble = document.createElement('div');
        bubble.className = 'bubble';

        if (data.status === 'approved') {
          bubble.textContent = '✅ Order has been approved by the manager. The order will now be placed with the supplier.';
        } else {
          bubble.textContent = '❌ Order has been rejected by the manager. Please speak with them for more details.';
        }

        div.appendChild(label);
        div.appendChild(bubble);
        msgs.appendChild(div);
        msgs.scrollTop = msgs.scrollHeight;
      }
    } catch(e) {}
  }, 5000); // Check every 5 seconds
}

async function initChat() {
  showTyping();

  const response = await fetch('https://order-proxy.hamzah-faruq007.workers.dev', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'x-api-key': ANTHROPIC_API_KEY,
      'anthropic-version': '2023-06-01',
    },
    body: JSON.stringify({
      model: 'claude-opus-4-7',
      max_tokens: 1000,
      system: SYSTEM_PROMPT,
      messages: [{ role: 'user', content: 'Hello' }]
    })
  });

  const data = await response.json();

  if (!response.ok) {
    removeTyping();
    addMessage('agent', 'API Error: ' + (data.error?.message || JSON.stringify(data)));
    return;
  }

  const reply = data.content[0].text;
  conversationHistory.push({ role: 'user', content: 'Hello' });
  conversationHistory.push({ role: 'assistant', content: reply });

  removeTyping();
  addMessage('agent', reply);
}

function handleKey(e) {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
}

function autoResize(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 120) + 'px';
}

window.addEventListener("DOMContentLoaded", () => {
  initChat();
});
</script>
</body>
</html>
